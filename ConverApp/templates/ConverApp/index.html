{% extends 'ConverApp/base.html' %}
{% load static %}

{% block title %}ConverHub | Tools{% endblock %}
{% block body %}
    <main class="page-content">

    <!-- Alerte personnalisée (Épurée de DaisyUI) -->
    <div id="alert-div" class="custom-alert" role="alert">
        <span id="alert-message"></span>
    </div>

    <!-- 🗺️ ONGLET DE NAVIGATION (100% pur CSS) -->
    <div id="action-btn" class="tab-container">
        <button class="action-btn" data-page="currency-converter-page" id="CCP">Convertisseur de devise</button>
        <button class="action-btn" data-page="units-converter-page" id="UC">Convertisseur de distance</button>
    </div>

    <!-- CARTE DE CONVERSION PRINCIPALE -->
    <div id="container">

        <!-- SECTION A : CONVERTISSEUR DE DEVISES -->
        <section id="currency-converter-page" class="page">
            <div class="meta-container">
                <h5 id="base-meta"></h5>
                <h1 id="target-meta"></h1>
                <p id="exchange-rate"></p>
                <p id="update-at"></p>
            </div>

            <!-- Grille d'alignement à plat à 3 colonnes -->
            <div class="converter-grid">
                <!-- Ligne 1 -->
                <select id="currency-first" placeholder="Choisissez une devise source..." autocomplete="off"></select>
                <button id="switchBtn" class="switch-btn">⇆</button>
                <select id="currency-second" placeholder="Choisissez une devise cible..." autocomplete="off"></select>

                <!-- Ligne 2 -->
                <input type="number" id="first-input" class="input-field" placeholder="Entrez le montant" autofocus>
                <div class="grid-spacer">=</div> <!-- L'espaceur visuel central -->
                <input type="text" id="second-input" class="input-field" disabled>
            </div>
        </section>

        <!-- SECTION B : CONVERTISSEUR D'UNITÉS (Conforme à ton croquis !) -->
        <section id="units-converter-page" class="page">

            <!-- Ligne 1 : Les deux sélecteurs et le bouton switch -->
            <div class="converter-grid">
                <select id="unit-first" placeholder="Choisissez l'unité source..." autocomplete="off"></select>
                <button id="switchUnitBtn" class="switch-btn">⇆</button>
                <select id="unit-second" placeholder="Choisissez l'unité cible..." autocomplete="off"></select>
            </div>

            <!-- Ligne 2 : Saisie en pleine largeur -->
            <div class="input-full-width">
                <input type="number" id="unit-input" class="input-field text-center" placeholder="Entrez la valeur à convertir">
            </div>

            <!-- Ligne 3 : Affichage du résultat en bas -->
            <div class="result-container">
                <h3 id="result-meta" class="result-text"></h3>
            </div>

        </section>

    </div>
</main>
{% endblock %}


<!-- Ton script logique inchangé (Conserve cette ligne) -->
{% block script %}
    <script src="{% static 'ConverApp/script.js' %}" defer></script>
{% endblock %}
